imports:
    - { resource: services/server.yaml }
    - { resource: services/client.yaml }
    
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true
    
    vs_websocket_logger:
        class: Vankosoft\WebsocketBundle\Logger\WebsocketLogger
        public: true
        arguments:
            - '%vs_websocket.logger.channel%'
            - '%vs_websocket.logger.path%'
            - '%env(APP_ENV)%'
